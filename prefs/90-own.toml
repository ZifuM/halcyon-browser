# Prefs that belong to our own code (src/). The audit checks that src/ really reads each one.

[meta]
title = "Our own features"

[[pref]]
name = "halcyon.updates.check.enabled"
value = true
why = "Daily check for a newer release (notification only; never downloads or installs by itself). Set false to stop it."
own = true

[[pref]]
name = "halcyon.updates.check.intervalHours"
value = 24
why = "Minimum hours between update checks."
own = true

[[pref]]
name = "halcyon.shield.updates.enabled"
value = true
why = "Keep Shield's filter lists up to date (checked hourly, downloaded when a list's own expiry passes). Set false to stop downloads; the last lists keep working."
own = true

[[pref]]
name = "halcyon.shield.cosmetic.enabled"
value = true
why = "Shield element hiding: hides ad containers and leftover blank boxes using the same lists that block requests. Set false to block requests only."
own = true
