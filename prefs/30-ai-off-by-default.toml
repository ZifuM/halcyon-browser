# Ownership promise #5: every AI feature, including local/on-device ones, is off by default.
# Users turn AI on in Settings > AI Controls; nothing is downloaded until they do.
# The global control is set to "blocked" so the Settings UI shows the true state, and each
# feature's own switch is off so it stays off even if the global control is unblocked by mistake.

[meta]
title = "AI off by default"

[[pref]]
name = "browser.ai.control.default"
value = "blocked"
why = "Global AI control starts at Blocked (shown in Settings > AI Controls)."

[[pref]]
name = "browser.ml.enable"
value = false
why = "The on-device machine-learning inference engine is off: no models download or run."

[[pref]]
name = "extensions.ml.enabled"
value = false
why = "Extensions can't use the browser's ML engine unless the user enables AI."

[[pref]]
name = "browser.ml.chat.enabled"
value = false
why = "No AI chatbot sidebar."

[[pref]]
name = "browser.ml.chat.page"
value = false
why = "No \"Ask an AI chatbot\" item in the page and tab menus. Firefox gates it on this, not on the chatbot switch above (found by the UI preview)."

[[pref]]
name = "browser.ml.chat.menu"
value = false
why = "No AI chatbot prompts in menus before a provider is chosen."

[[pref]]
name = "browser.ml.chat.shortcuts"
value = false
why = "No AI shortcut button popping up over selected text."

[[pref]]
name = "browser.ml.linkPreview.enabled"
value = false
why = "No AI key-points in link previews."

[[pref]]
name = "browser.tabs.groups.smart.enabled"
value = false
why = "No AI tab-group suggestions."

[[pref]]
name = "browser.translations.enable"
value = false
why = "Translations use on-device AI models downloaded from Mozilla; off until the user enables them."

[[pref]]
name = "pdfjs.enableGuessAltText"
value = false
why = "No AI-generated alt text in the PDF editor."
upstream = "toolkit/components/pdfjs/PdfJsDefaultPrefs.js"
