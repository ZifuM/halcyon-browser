// Halcyon UI preview harness (CI only, never shipped). First line must be a comment.
//
// Runs as Firefox autoconfig in a stock Firefox. Kept tiny: it maps two resource:// roots and
// hands over to PreviewScenario.sys.mjs, which runs as a normal ES module.

(function halcyonPreview() {
  const env = Services.env;
  // Stands in for our patch to nsContentSecurityUtils.cpp, which allows the command bar's
  // module (under its moz-src:// name) to compile WebAssembly. Stock Firefox doesn't have it,
  // and here the module loads from resource://halcyon-preview instead.
  Services.prefs.setBoolPref("security.allow_eval_with_system_principal", true);
  const res = Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler);
  for (const [name, variable] of [
    ["halcyon-preview", "HALCYON_PREVIEW_SRC"],
    ["halcyon-preview-tools", "HALCYON_PREVIEW_TOOLS"],
  ]) {
    const path = env.get(variable);
    if (!path) {
      return;
    }
    const dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    dir.initWithPath(path);
    res.setSubstitution(name, Services.io.newFileURI(dir));
  }
  ChromeUtils.importESModule("resource://halcyon-preview-tools/PreviewScenario.sys.mjs").PreviewScenario.start();
})();
