# Shield test corpus. Each case is one request as the browser would classify it.
#   url     the request          source  the page making it      type  browser request type
#   expect  "block" or "allow"    note    why this case matters
#
# "allow" cases are as important as "block" ones: they're the sites people notice when an
# ad blocker breaks them.

# ---- Ad networks and ad tech (should be blocked) -----------------------------------------

[[case]]
url = "https://securepubads.g.doubleclick.net/tag/js/gpt.js"
source = "https://www.theguardian.com/world"
type = "script"
expect = "block"
note = "Google Publisher Tag"

