[package]
name = "shield-check"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "Runs Shield's filter lists through Firefox's in-tree adblock engine against a corpus of known requests, and benchmarks it."

[dependencies]
# The exact engine the browser uses (Firefox's fork of brave/adblock-rust), with the same features
# the browser enables, minus Gecko-only memory reporting.
etp_engine = { path = "../../engine/toolkit/components/content-classifier/etp_engine", default-features = false, features = ["full-regex-handling", "single-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"

[workspace]

[profile.release]
debug = false

# Mirrors [patch.crates-io] in Firefox's root Cargo.toml (generated by tools/shield/sync_cargo_patches.py)
[patch.crates-io]
cmake = { path = "../../engine/build/rust/cmake" }
vcpkg = { path = "../../engine/build/rust/vcpkg" }
mozbuild = { path = "../../engine/build/rust/mozbuild" }
windows-targets = { path = "../../engine/build/rust/windows-targets" }
windows-link = { path = "../../engine/build/rust/windows-link" }
windows = { path = "../../engine/build/rust/windows" }
oslog = { path = "../../engine/build/rust/oslog" }
terminal_size = { path = "../../engine/build/rust/terminal_size" }
bitflags = { path = "../../engine/build/rust/bitflags" }
r-efi = { path = "../../engine/build/rust/r-efi" }
redox_users = { path = "../../engine/build/rust/redox_users" }
redox_syscall = { path = "../../engine/build/rust/redox_syscall" }
hermit-abi = { path = "../../engine/build/rust/hermit-abi" }
spin = { path = "../../engine/build/rust/spin" }
portable-atomic = { path = "../../engine/build/rust/portable-atomic" }
portable-atomic-util = { path = "../../engine/build/rust/portable-atomic-util" }
base64_21 = { package = "base64", path = "../../engine/build/rust/base64" }
wasi_0_11 = { package = "wasi", path = "../../engine/build/rust/wasi" }
itertools_0_13 = { package = "itertools", path = "../../engine/build/rust/itertools-0.13" }
itertools_0_14 = { package = "itertools", path = "../../engine/build/rust/itertools" }
