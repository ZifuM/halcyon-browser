# Full browser builds. Manual trigger (pick platforms and profile), version tags, and weekly.
#
# Runner sizing: free GitHub-hosted runners for public repos (4 vCPU / 16 GB) can finish a `dev`
# build in ~2-5 h, faster once the sccache cache is warm. `release` (PGO + LTO) needs a larger or
# self-hosted runner: set the LINUX_RUNNER / MACOS_RUNNER / WINDOWS_RUNNER repository variables.
name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms (comma-separated: windows,linux,macos)"
        default: "windows"
      profile:
        description: "Build profile"
        type: choice
        options: [dev, release]
        default: dev
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 15 * * 6"   # weekly smoke build

permissions:
  contents: read

env:
  PROFILE: ${{ inputs.profile || 'dev' }}
  SCCACHE_CACHE_SIZE: 8G
  HX_MOZCONFIG_EXTRA: "ac_add_options --with-ccache=sccache"

jobs:
  windows:
    if: contains(inputs.platforms || 'windows,linux', 'windows')
    # Runs inside MozillaBuild's MSYS2 shell; mach bootstraps its own clang and Windows SDK.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2022' }}
    timeout-minutes: 355
    env:
      MOZILLABUILD: C:\mozilla-build
      MSYS2_PATH_TYPE: inherit          # let the MozillaBuild shell see git and Python
      SCCACHE_DIR: D:\sccache
      PYTHONPATH: tools                 # for `python3 -m hx`; hx removes it again for mach
    defaults:
      run:
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - name: Prepare git and install MozillaBuild
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S'
          Get-PSDrive C, D | Format-Table Name, @{n='FreeGB';e={[int]($_.Free/1GB)}}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: D:\sccache
          key: sccache-windows-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-windows-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-
            sccache-windows-${{ env.PROFILE }}-
      - name: Download Firefox source
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Download" -- python3 -m hx download
      - name: Apply our changes
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Import" -- python3 -m hx import
      - name: Bootstrap toolchains
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Bootstrap" -- python3 -m hx bootstrap
      - name: Build
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Build" -- python3 -m hx build --profile "$PROFILE" --os windows
      - name: Package (setup .exe + portable .zip)
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Package" -- python3 -m hx package --os windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.installer.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.zip
          retention-days: 30

  linux:
    if: contains(inputs.platforms || 'windows,linux', 'linux')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 355
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - name: Free disk space (Firefox needs ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-linux-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-linux-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-
            sccache-linux-${{ env.PROFILE }}-
      - run: python3 tools/ci/annotate.py "Download" -- ./hx download
      - run: python3 tools/ci/annotate.py "Import" -- ./hx import
      - run: python3 tools/ci/annotate.py "Bootstrap" -- ./hx bootstrap
      - run: python3 tools/ci/annotate.py "Build" -- ./hx build --profile "$PROFILE"
      - run: python3 tools/ci/annotate.py "Package" -- ./hx package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.tar.*
          if-no-files-found: error
          retention-days: 30

  macos:
    if: contains(inputs.platforms || 'windows,linux', 'macos')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 355
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-macos-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-${{ github.run_id }}
          restore-keys: |
            sccache-macos-${{ env.PROFILE }}-${{ hashFiles('project.toml') }}-
            sccache-macos-${{ env.PROFILE }}-
      - run: python3 tools/ci/annotate.py "Download" -- ./hx download
      - run: python3 tools/ci/annotate.py "Import" -- ./hx import
      - run: python3 tools/ci/annotate.py "Bootstrap" -- ./hx bootstrap
      - run: python3 tools/ci/annotate.py "Build" -- ./hx build --profile "$PROFILE" --os macos
      - run: python3 tools/ci/annotate.py "Package" -- ./hx package --os macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  network-audit:
    # Runs the freshly built Linux browser with a fresh profile behind a recording proxy and fails
    # if it contacts anything not listed in privacy/requests.toml (docs/EVERY-REQUEST.md).
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-${{ env.PROFILE }}
          path: dist
      - name: Install runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libgtk-3-0t64 libasound2t64 libdbus-glib-1-2
      - name: Unpack
        run: mkdir app && tar -xf dist/*.tar.* -C app && ls app
      - name: Audit 120 s of idle browsing
        run: |
          app_name=$(sed -n 's/^app_name *= *"\([^"]*\)".*/\1/p' project.toml)
          python3 tools/audit/network_audit.py --browser "app/$app_name/$app_name" --seconds 120 \
            --markdown "$GITHUB_STEP_SUMMARY" --json audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-audit
          path: audit.json

  release:
    # Pushing a tag like v0.2.0 builds everything and publishes a GitHub Release with the
    # installer attached. The in-browser update notifier reads these releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, network-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -R out
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            out/windows-installer-*/*.installer.exe out/windows-portable-*/*.zip out/linux-x86_64-*/*.tar.*
