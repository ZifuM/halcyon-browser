# Full browser builds. Manual trigger (pick platforms and profile), version tags, and weekly.
#
# Runner sizing: free GitHub-hosted runners for public repos (4 vCPU / 16 GB) can finish a `dev`
# build in ~2-5 h. `release` (PGO + LTO) needs a larger or self-hosted runner: set the
# LINUX_RUNNER / MACOS_RUNNER / WINDOWS_RUNNER repository variables.
#
# Toolchains (clang, the Windows SDK, Rust, Node, ...) are fetched by configure itself
# (--enable-bootstrap) instead of a separate `mach bootstrap`, which stalled on CI runners.
# A manual run with "publish" set puts the Windows installer on the `test-build` pre-release.
name: build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms (comma-separated: windows,linux,macos)"
        default: "windows"
      profile:
        description: "Build profile"
        type: choice
        options: [dev, release]
        default: dev
      publish:
        description: "Publish the Windows installer as the test-build pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 15 * * 6"   # weekly smoke build

permissions:
  contents: read

env:
  PROFILE: ${{ inputs.profile || 'dev' }}
  # Machine-local mozconfig additions (hx appends them; "\n" separates lines). No debug symbols
  # on CI: they double the disk and link time and nobody debugs these builds.
  # Single quotes: the "\n" must reach hx as the two characters, not a newline.
  HX_MOZCONFIG_EXTRA: 'ac_add_options --enable-bootstrap\nac_add_options --disable-debug-symbols'
  MACH_NO_TERMINAL_FOOTER: "1"

jobs:
  windows:
    if: contains(inputs.platforms || 'windows,linux', 'windows')
    # Runs inside MozillaBuild's MSYS2 shell; configure fetches clang and the Windows SDK.
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-2022' }}
    timeout-minutes: 355
    env:
      MOZILLABUILD: C:\mozilla-build
      MSYS2_PATH_TYPE: inherit          # let the MozillaBuild shell see git and Python
      PYTHONPATH: tools                 # for `python3 -m hx`; hx removes it again for mach
    defaults:
      run:
        shell: C:\mozilla-build\msys2\usr\bin\bash.exe --login -eo pipefail {0}
    steps:
      - name: Prepare git, install MozillaBuild, pick the roomiest drive
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile mb.exe
          Start-Process -Wait -FilePath .\mb.exe -ArgumentList '/S'
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in 'C','D' }
          $best = $drives | Sort-Object Free -Descending | Select-Object -First 1
          $summary = ($drives | ForEach-Object { "$($_.Name): $([int]($_.Free/1GB)) GB free" }) -join ', '
          Write-Output "::notice title=Disk::$summary; objdir and toolchains on $($best.Name):"
          $root = "$($best.Name):/hx"
          New-Item -ItemType Directory -Force -Path "$root/obj", "$root/mozbuild" | Out-Null
          "OBJDIR=$root/obj" >> $env:GITHUB_ENV
          "MOZBUILD_STATE_PATH=$root/mozbuild" >> $env:GITHUB_ENV
          "HX_MOZCONFIG_EXTRA=$env:HX_MOZCONFIG_EXTRA\nmk_add_options MOZ_OBJDIR=$root/obj" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Build the command bar index (Rust -> WebAssembly)
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          python tools/omni/build_wasm.py
      - name: Download Firefox source
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Download" -- python3 -m hx download
      - name: Apply our changes
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Import" -- python3 -m hx import
      - name: Build
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py --timeout 19200 "Build" -- python3 -m hx build --profile "$PROFILE" --os windows
      - name: Package (setup .exe + portable .zip)
        run: cd "$GITHUB_WORKSPACE" && python3 tools/ci/annotate.py "Package" -- python3 -m hx package --os windows
      - name: Collect the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path project.toml -Pattern '^display\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $name = (Select-String -Path project.toml -Pattern '^name\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $setup = Get-ChildItem "$env:OBJDIR/dist/*.installer.exe", "$env:OBJDIR/dist/install/sea/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Output "::error title=Package::no installer in $env:OBJDIR/dist"; exit 1 }
          Copy-Item $setup.FullName "out/$name-$version-setup-win64.exe"
          $zip = Get-ChildItem "$env:OBJDIR/dist/*.zip" | Where-Object { $_.Name -notmatch 'xpt_artifacts|mozinfo|crashreporter' } | Sort-Object Length -Descending | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "out/$name-$version-portable-win64.zip" }
          Get-ChildItem out | ForEach-Object { Write-Output "::notice title=Built::$($_.Name) ($([int]($_.Length/1MB)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.PROFILE }}
          path: out/*.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ env.PROFILE }}
          path: out/*.zip
          retention-days: 30

  linux:
    if: contains(inputs.platforms || 'windows,linux', 'linux')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 355
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
    steps:
      - name: Free disk space (Firefox needs ~40 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the command bar index (Rust -> WebAssembly)
        run: rustup target add wasm32-unknown-unknown && python3 tools/omni/build_wasm.py
      - run: python3 tools/ci/annotate.py "Download" -- ./hx download
      - run: python3 tools/ci/annotate.py "Import" -- ./hx import
      - run: python3 tools/ci/annotate.py --timeout 19200 "Build" -- ./hx build --profile "$PROFILE"
      - run: python3 tools/ci/annotate.py "Package" -- ./hx package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.tar.*
          if-no-files-found: error
          retention-days: 30

  macos:
    if: contains(inputs.platforms || 'windows,linux', 'macos')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    timeout-minutes: 355
    env:
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/.mozbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the command bar index (Rust -> WebAssembly)
        run: rustup target add wasm32-unknown-unknown && python3 tools/omni/build_wasm.py
      - run: python3 tools/ci/annotate.py "Download" -- ./hx download
      - run: python3 tools/ci/annotate.py "Import" -- ./hx import
      - run: python3 tools/ci/annotate.py --timeout 19200 "Build" -- ./hx build --profile "$PROFILE" --os macos
      - run: python3 tools/ci/annotate.py "Package" -- ./hx package --os macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-${{ env.PROFILE }}
          path: engine/obj-*/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  network-audit:
    # Runs the freshly built Linux browser with a fresh profile behind a recording proxy and fails
    # if it contacts anything not listed in privacy/requests.toml (docs/EVERY-REQUEST.md).
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-${{ env.PROFILE }}
          path: dist
      - name: Install runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libgtk-3-0t64 libasound2t64 libdbus-glib-1-2
      - name: Unpack
        # dist/ can hold more than one archive (symbols, test info): unpack the largest, the browser.
        run: |
          echo "::notice title=Artifact::$(find dist -type f -printf '%P (%s bytes)  ' | head -c 900)"
          archive=$(find dist -type f -name '*.tar.*' -printf '%s %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          if [ -z "$archive" ]; then echo "::error title=Unpack::no .tar.* in the artifact"; exit 1; fi
          echo "Unpacking $archive"
          mkdir app && tar -xf "$archive" -C app
          echo "::notice title=Unpacked::$(ls app | tr '\n' ' ')"
      - name: Audit 120 s of idle browsing
        run: |
          app_name=$(sed -n 's/^app_name *= *"\([^"]*\)".*/\1/p' project.toml)
          python3 tools/audit/network_audit.py --browser "app/$app_name/$app_name" --seconds 120 \
            --markdown "$GITHUB_STEP_SUMMARY" --json audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-audit
          path: audit.json

  publish-test-build:
    # A manual build with "publish" on: the Windows installer goes on the `test-build`
    # pre-release (replaced each time), so it can be downloaded without an Actions login.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && !cancelled()
    needs: [windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: out
          merge-multiple: true
      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/publish_test_build.sh "$GITHUB_SHA"

  release:
    # Pushing a tag like v0.2.0 builds everything and publishes a GitHub Release with the
    # installer attached. The in-browser update notifier reads these releases.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, network-audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -R out
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            out/windows-installer-*/*.installer.exe out/windows-portable-*/*.zip out/linux-x86_64-*/*.tar.*
